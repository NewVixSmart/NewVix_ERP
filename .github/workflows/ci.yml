name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Silk.Trading.slnx

      - name: Build (warnings are errors)
        run: dotnet build Silk.Trading.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Silk.Trading.slnx -c Release --no-build --results-directory TestResults --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          retention-days: 14

  package-vulnerability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Silk.Trading.slnx

      - name: Vulnerability scan (fail on any CVE)
        run: dotnet list Silk.Trading.slnx package --vulnerable --include-transitive

  docker-image:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Silk-CI-Smoke-Passw0rd-2026!"
        ports:
          - "1433:1433"
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Silk-CI-Smoke-Passw0rd-2026!' -Q 'SELECT 1' -b"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 40
          --health-start-period 60s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build web image
        run: docker build -t silk-trading-web:ci -f src/Silk.Trading.Web/Dockerfile .

      - name: Smoke check (image metadata)
        run: |
          docker inspect silk-trading-web:ci --format '{{.Config.ExposedPorts}}'
          docker inspect silk-trading-web:ci --format 'Healthcheck={{.Config.Healthcheck}}'

      - name: Run container (Production env, real Jwt__Key, real SQL Server)
        run: |
          docker run -d --name silk-trading-web-smoke \
            -p 8080:80 \
            --add-host host.docker.internal:host-gateway \
            -e ASPNETCORE_ENVIRONMENT=Production \
            -e Jwt__Key="Silk-CI-Smoke-JwtSecret-0123456789-abcdefghijklmnop" \
            -e Seed__AdminPassword="Silk-CiAdmin-Passw0rd-2026!" \
            -e ConnectionStrings__DefaultConnection="Server=host.docker.internal,1433;Database=SilkTradingDb;User Id=sa;Password=Silk-CI-Smoke-Passw0rd-2026!;TrustServerCertificate=True" \
            silk-trading-web:ci

      - name: Wait for container health
        run: |
          for i in $(seq 1 36); do
            status=$(docker inspect silk-trading-web-smoke --format '{{.State.Health.Status}}' 2>/dev/null || echo pending)
            echo "attempt $i: health=$status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              echo "::error::Container reported unhealthy below"
              docker logs silk-trading-web-smoke
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for container health"
          docker logs silk-trading-web-smoke
          exit 1

      - name: Verify HTTP health endpoint responds
        run: |
          curl -fsS --retry 10 --retry-delay 5 --retry-all-errors http://localhost:8080/healthz

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install accessibility gate dependencies
        working-directory: e2e
        run: npm install --no-audit --no-fund

      - name: Install Chromium for Playwright
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Accessibility gate (axe-core, critical/serious)
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8080
          SILK_USER: admin
          SILK_PASS: Silk-CiAdmin-Passw0rd-2026!
        run: node a11y-gate.cjs