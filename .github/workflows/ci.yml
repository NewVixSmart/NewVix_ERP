name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

# Without this, a superseded pull request keeps burning the runner until the
# 360-minute per-job default. Every push to a PR branch supersedes the previous
# run, so cancel-in-progress is the difference between one run per push and one
# run per push queued behind the last one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # THE text-hygiene gate for .cshtml and .md - the file types `dotnet format` never sees.
      # It sits here, before Setup .NET, on purpose: it needs nothing but pwsh, which
      # ubuntu-latest already has, so a BOM or a CRLF line ending fails the run in seconds
      # instead of after a restore and a Release build. The `run` value is a plain literal with
      # no GitHub expression, matching the format gate below, so nothing can rewrite the
      # command at run time. It is read-only: it names violating files, it never fixes them.
      #
      # Locally, to reproduce:
      #   pwsh -NoProfile -File scripts/check-text-hygiene.ps1
      # To see what is scanned, what is not, and why:
      #   pwsh -NoProfile -File scripts/check-text-hygiene.ps1 -ListExclusions
      - name: Verify Razor and Markdown text hygiene
        run: pwsh -NoProfile -File scripts/check-text-hygiene.ps1

      # THE design-system build gate. The Tailwind sources live in ui/ and the built
      # app.css is committed, so a stray edit to a view, a new utility class, or a changed
      # token must produce (and commit) the matching bundle. `git diff --exit-code` fails the
      # run when the checked-in bundle is stale, and npm ci respects the pinned lockfile.
      - name: Build app.css from ui/ (Tailwind v4) and fail on uncommitted output
        run: |
          cd ui
          npm ci
          npm run build:css
          git diff --exit-code -- ../src/NewVixSmart.Web/wwwroot/css/app.css

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore NewVixSmart.slnx

      # THE formatting gate. One command, one source of truth, same runner and
      # same SDK as the build below. It sits after Restore and before Build
      # because `--no-restore` needs the restore assets the step above produced
      # on this runner - without them the gate cannot even start. The `run` value
      # is a plain literal: no GitHub expression is interpolated into it, so
      # nothing can rewrite the command at run time.
      # Locally, to fix what this reports: dotnet format NewVixSmart.slnx
      - name: Verify formatting (dotnet format --verify-no-changes)
        run: dotnet format NewVixSmart.slnx --verify-no-changes --no-restore

      - name: Build (warnings are errors)
        run: dotnet build NewVixSmart.slnx -c Release --no-restore

      - name: Install dotnet-ef (pinned by .config/dotnet-tools.json)
        run: dotnet tool restore

      - name: Verify EF model matches migrations snapshot
        run: dotnet ef migrations has-pending-model-changes --project src/NewVixSmart.Web/NewVixSmart.Web.csproj --startup-project src/NewVixSmart.Web/NewVixSmart.Web.csproj --configuration Release

      - name: Test
        run: dotnet test NewVixSmart.slnx -c Release --no-build --results-directory TestResults --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          retention-days: 14

  # The one gate the rest of the suite structurally cannot provide.
  #
  # Every other test builds its schema with EnsureCreated() on in-memory SQLite, so the
  # 38-migration chain has never been executed anywhere in CI - only the model was
  # compared with its snapshot, and a migration that SQL Server rejects would ship green.
  # This job runs a real SQL Server engine, points NVS_TEST_SQLSERVER at it, and runs
  # the whole suite so nothing is skipped: the SQLite tests keep their in-memory
  # databases, and MigrationChainSqlServerTests gets the engine it asks for.
  #
  # `build-and-test` is left untouched on purpose; the only difference there is that the
  # SQL Server tests report themselves skipped with the reason in the trx, which is why
  # this job exists to make them count for real.
  migration-chain-sqlserver:
    name: Migration chain (real SQL Server)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Vix-CI-Migration-Passw0rd-2026!"
        ports:
          - "1433:1433"
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Vix-CI-Migration-Passw0rd-2026!' -Q 'SELECT 1' -b"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 40
          --health-start-period 60s
    env:
      # The tests build a throwaway database per run and drop it afterwards; they never
      # touch NewVixSmartDb. The password is the CI service's own, scoped to this job.
      NVS_TEST_SQLSERVER: "Server=localhost,1433;Database=master;User Id=sa;Password=Vix-CI-Migration-Passw0rd-2026!;TrustServerCertificate=True;Encrypt=False"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore NewVixSmart.slnx

      - name: Build
        run: dotnet build NewVixSmart.slnx -c Release --no-restore

      - name: Test against the SQL Server engine
        run: dotnet test NewVixSmart.slnx -c Release --no-build --results-directory TestResults --logger "trx;LogFileName=test-results.trx"

      # A green run that quietly skipped the very tests this job exists for is not a pass.
      # The trx is read rather than trusted, and the class is counted instead of the whole
      # suite so a 795/801 green run that skipped these six still fails here. The count is
      # also asserted against the source, so adding a seventh SQL Server test without
      # raising this number is a red build rather than a quietly unverified guarantee.
      - name: Fail if the SQL Server tests did not really run
        run: |
          set -o pipefail
          trx=$(ls TestResults/*.trx)
          declared=$(grep -c '\[SqlServerFact\]' tests/NewVixSmart.Web.Tests/MigrationChainSqlServerTests.cs || true)
          passed=$(grep 'MigrationChainSqlServerTests' "$trx" | grep -c 'outcome="Passed"' || true)
          skipped=$(grep 'MigrationChainSqlServerTests' "$trx" | grep -c 'outcome="NotExecuted"' || true)
          echo "MigrationChainSqlServerTests -> declared: $declared, passed: $passed, not executed: $skipped"
          if [ "${declared:-0}" -lt 1 ] || [ "${passed:-0}" -ne "${declared:-0}" ] || [ "${skipped:-0}" -ne 0 ]; then
            echo "::error::The migration-chain tests did not all run against SQL Server (expected $declared passed and 0 skipped, got $passed passed and $skipped skipped)."
            exit 1
          fi

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: test-results-sqlserver
          path: '**/TestResults/*.trx'
          retention-days: 14

  package-vulnerability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore NewVixSmart.slnx

      - name: Vulnerability scan (fail on any CVE)
        shell: bash
        run: |
          set -o pipefail
          dotnet list NewVixSmart.slnx package --vulnerable --include-transitive 2>&1 | tee /tmp/vuln-scan.txt
          if [ ${PIPESTATUS[0]} -ne 0 ]; then echo "::error::dotnet vulnerability scan tool exited non-zero"; exit ${PIPESTATUS[0]}; fi
          if grep -Eq "has the following vulnerable packages|known vulnerabilities" /tmp/vuln-scan.txt; then
            echo "::error::Vulnerable packages detected - the CVE gate fails the build regardless of the dotnet CLI exit code."
            exit 1
          fi

  docker-image:
    runs-on: ubuntu-latest
    # The heaviest job by far: a SQL Server service container, a two-stage
    # image build, a Playwright + Chromium download, then the axe gate walking
    # ~38 pages against a real Production-mode app.
    timeout-minutes: 90
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU26-ubuntu-22.04
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Vix-CI-Smoke-Passw0rd-2026!"
        ports:
          - "1433:1433"
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Vix-CI-Smoke-Passw0rd-2026!' -Q 'SELECT 1' -b"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 40
          --health-start-period 60s
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build web image
        run: docker build -t new-vix-smart-web:ci -f src/NewVixSmart.Web/Dockerfile .

      - name: Smoke check (image metadata)
        run: |
          docker inspect new-vix-smart-web:ci --format '{{.Config.ExposedPorts}}'
          docker inspect new-vix-smart-web:ci --format 'Healthcheck={{.Config.Healthcheck}}'

      - name: Run container (Production env, real Jwt__Key, real SQL Server)
        run: |
          docker run -d --name new-vix-smart-web-smoke \
            -p 8080:80 \
            --add-host host.docker.internal:host-gateway \
            -e ASPNETCORE_ENVIRONMENT=Production \
            -e Jwt__Key="Vix-CI-Smoke-JwtSecret-0123456789-abcdefghijklmnop" \
            -e Seed__AdminPassword="Vix-CiAdmin-Passw0rd-2026!" \
            -e Seed__AccountantPassword="Vix-CiAccountant-Passw0rd-2026!" \
            -e Seed__WarehousePassword="Vix-CiWarehouse-Passw0rd-2026!" \
            -e ConnectionStrings__DefaultConnection="Server=host.docker.internal,1433;Database=NewVixSmartDb;User Id=sa;Password=Vix-CI-Smoke-Passw0rd-2026!;TrustServerCertificate=True" \
            new-vix-smart-web:ci

      - name: Wait for container health
        run: |
          for i in $(seq 1 36); do
            status=$(docker inspect new-vix-smart-web-smoke --format '{{.State.Health.Status}}' 2>/dev/null || echo pending)
            echo "attempt $i: health=$status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              echo "::error::Container reported unhealthy below"
              docker logs new-vix-smart-web-smoke
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for container health"
          docker logs new-vix-smart-web-smoke
          exit 1

      - name: Verify HTTP health endpoint responds
        run: |
          curl -fsS --retry 10 --retry-delay 5 --retry-all-errors http://localhost:8080/healthz

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'

      - name: Install accessibility gate dependencies
        working-directory: e2e
        # npm ci, not npm install: e2e/package.json uses ^ ranges
        # (axe-core ^4.13.0, playwright ^1.63.0) and e2e/package-lock.json is
        # committed. `npm install` is free to resolve those ranges to whatever
        # the registry serves today, so the accessibility gate - the one job
        # that decides whether the UI ships - was not reproducible.
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for Playwright
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Accessibility gate (axe-core, critical/serious)
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8080
          VIX_USER: admin
          VIX_PASS: Vix-CiAdmin-Passw0rd-2026!
        run: node a11y-gate.cjs

  codeql:
    name: CodeQL (C#)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # `contents: read` is what the checkout and the C# extraction need;
    # `security-events: write` is what lets analyze upload the SARIF results.
    # Nothing else is granted - in particular not `actions: write` or
    # `packages: write`, neither of which codeql-action needs.
    permissions:
      contents: read
      security-events: write
    # FORK PULL REQUESTS. GitHub never grants `security-events: write` to the
    # GITHUB_TOKEN of a `pull_request` coming from a fork, so the analyze step
    # died there with "Resource not accessible by integration" - i.e. the scan
    # could not run for external contributions at all, and the failure looked
    # like a repository problem rather than a platform one.
    #
    # There is no token scope that fixes this: the fallback (reporting as a
    # check run or PR comment) needs `checks: write` / `pull-requests: write`,
    # which forks do not get either. `pull_request_target` would grant them, but
    # it runs this workflow against untrusted head code and is not acceptable.
    #
    # So the job is skipped for forks and the skip is visible in the run.
    # build-and-test, package-vulnerability, secret-scan and docker-image all
    # still run on forks, so an external PR is not left unverified.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          languages: csharp
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          category: /language:csharp

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # gitleaks-action does more than exit non-zero: on a pull_request it posts
    # a findings comment, and on a non-PR push it files/updates a tracking
    # issue. That is exactly the documented behaviour wanted here (a leak in a
    # merge commit must not slip through), and it needs those two write scopes.
    # `contents: read` covers the fetch-depth: 0 checkout it needs for the log.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    # FORK PULL REQUESTS: the GITHUB_TOKEN of a `pull_request` from a fork is
    # read-only, so both write scopes above are downgraded to read and the
    # action's comment/issue step fails. Skipped rather than failed; the other
    # jobs still cover the fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout (full history, gitleaks needs the log)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Report findings instead of only annotating the diff, so a leaked secret
          # in a merge commit or a non-PR push cannot slip through.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  dependency-review:
    name: Dependency review
    # Only meaningful on the pull request: it diffs the proposed change set against the base.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `contents: read` for the checkout; `pull-requests: write` is required by
    # `comment-summary-in-pr` below, which posts the summary as a PR comment.
    # Previously the job declared only `contents: read`, so the comment step
    # could not have worked even on an internal pull request.
    permissions:
      contents: read
      pull-requests: write
    # FORK PULL REQUESTS: read-only token again, so the summary comment cannot
    # be posted. The job still runs - the dependency *diff* itself works fine -
    # and `fail-on-severity` still gates the build; only the comment is
    # unavailable, which is the smaller loss of the two.
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
