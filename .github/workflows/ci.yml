name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Silk.Trading.slnx

      - name: Build (warnings are errors)
        run: dotnet build Silk.Trading.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Silk.Trading.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          retention-days: 14

  package-vulnerability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Silk.Trading.slnx

      - name: Vulnerability scan (fail on any CVE)
        run: dotnet list Silk.Trading.slnx package --vulnerable --include-transitive

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build web image
        run: docker build -t silk-trading-web:ci -f src/Silk.Trading.Web/Dockerfile .

      - name: Smoke check (image metadata)
        run: |
          docker inspect silk-trading-web:ci --format '{{.Config.ExposedPorts}}'
          docker inspect silk-trading-web:ci --format 'Healthcheck={{.Config.Healthcheck}}'