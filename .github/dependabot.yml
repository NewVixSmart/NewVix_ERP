version: 2

updates:
  # ASP.NET Core / EF Core / Aspire packages
  - package-ecosystem: nuget
    directory: "/src/NewVixSmart.Web"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Khartoum
    open-pull-requests-limit: 5
    groups:
      aspnet-core:
        patterns:
          - "Microsoft.AspNetCore.*"
      ef-core:
        patterns:
          - "Microsoft.EntityFrameworkCore.*"
      aspire:
        patterns:
          - "Aspire.*"
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: nuget
    directory: "/tests/NewVixSmart.Web.Tests"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Khartoum
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: nuget
    directory: "/aspire/Vix.AppHost"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Khartoum
    open-pull-requests-limit: 3
    groups:
      # The MessagePack entry is a deliberate SECURITY PIN, not a used
      # dependency: Aspire.Hosting.* -> StreamJsonRpc 2.22.23 depends on
      # MessagePack with a bare ">= 2.5.192", which carries 11 advisories
      # (incl. two HIGH). Nothing else in this project is a NuGet dependency
      # that dependabot would touch, so without this group the pin was orphaned:
      # the next Aspire bump could quietly reintroduce a vulnerable tree.
      # See docs/audit-round18-findings.md (R18-8).
      security-pins:
        patterns:
          - "MessagePack"
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: nuget
    directory: "/aspire/Vix.ServiceDefaults"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Khartoum
    open-pull-requests-limit: 3
    groups:
      # Microsoft.Extensions.Http.Resilience ships on its own cadence (10.0.0,
      # 10.1.0 ... 10.10.0) and so does not track the 10.0.11 servicing band
      # used elsewhere in the solution. It was therefore the only package in
      # this project that dependabot would propose individually while the
      # OpenTelemetry packages moved separately - three PRs a week for one
      # small project. Grouped so the whole ServiceDefaults set moves together.
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      opentelemetry:
        patterns:
          - "OpenTelemetry.*"
    commit-message:
      prefix: "build(deps)"

  # Playwright / axe-core used by the accessibility gate
  - package-ecosystem: npm
    directory: "/e2e"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Khartoum
    open-pull-requests-limit: 3
    groups:
      playwright:
        patterns:
          - "playwright*"
          - "@playwright/*"
    commit-message:
      prefix: "build(deps)"

  # GitHub Actions pinned by SHA in ci.yml - keep them current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Khartoum
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
